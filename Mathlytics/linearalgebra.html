<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathlytics – Лінійна алгебра</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="header-left">
      <a href="index.html">
        <img src="images/logo.png" alt="Mathlytics Logo" width="150px">
      </a>
    </div>

      <input type="checkbox" id="burger-toggle" class="burger-toggle">
      <label for="burger-toggle" class="burger-menu">☰</label>

    <nav class="header-right">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="linearalgebra.html">Матричний калькулятор</a></li>
        <li><a href="statistics.html">Статистичні інструменти</a></li>
        <li><a href="graphic.html">Побудова графіка</a></li>
      </ul>
    </nav>
  </header>

  <main>
  <section class="matrix-calculator">
    <div class="matrix-header">
      <h2>Калькулятор матриць</h2>
      <p>Введіть елементи матриць нижче.</p>
    </div>

    <div class="matrix-section">
      <div class="matrices-row">
	<div class="matrix-plus-actions">
        <div class="matrix-container">
          <h3>Матриця A</h3>
        <div class="matrix-table">
          <input type="text"><input type="text"><input type="text">
          <input type="text"><input type="text"><input type="text">
    	  <input type="text"><input type="text"><input type="text">
  	</div>
        </div>

        <div class="matrix-actions">
          <button>Визначник</button>
          <button>Обернена матриця</button>
          <button>Ранг</button>
          <button>Власні числа / вектори</button>
        </div>
        </div>
  
        <div class="matrix-operations">
          <button>+</button>
          <button>−</button>
          <button>×</button>
        </div>
	
	<div class="matrix-plus-actions">
        <div class="matrix-container">
          <h3>Матриця B</h3> 
        <div class="matrix-table">
          <input type="text"><input type="text"><input type="text">
          <input type="text"><input type="text"><input type="text">
    	  <input type="text"><input type="text"><input type="text">
  	</div>
        </div>

      <div class="matrix-actions">
        <button>Визначник</button>
        <button>Обернена матриця</button>
        <button>Ранг</button>
        <button>Власні числа / вектори</button>
      </div>

      </div>
    </div>
  </section>

    <section class="matrix-results">
      <h4>Результати</h4>
      <textarea readonly rows="6" placeholder="Тут з’являться результати обчислень..."></textarea><br>
      <button>Переглянути кроки обчислень</button>
    </section>
  </main>

  <footer>
    <div class="footer-left">
      <ul>
        <li><a href="about.html">Про проєкт</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </div>
    <div class="footer-right">

    </div>
